<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administratum</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#120d0a">
<style>
  /* The phone's remote page (mobile.js). Colours: the hall's chrome roles (index.html :root), set per theme by chrome.js. */
  @font-face { font-family: 'VT323'; font-weight: 400; font-display: swap; size-adjust: 125%; src: url(fonts/vt323-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Pirata One'; font-weight: 400; font-display: swap; src: url(fonts/pirata-one-latin.woff2) format('woff2'); }
  :root { --bg: #060404; --bar: #120d0a; --ink: #d6c79f; --dim: #8a7a5c; --light: #f3e6c4; --edge: #3a2a1e; --btn: #1a120e; --copper: #b8742e;
    --red: #a0221a; --pink: #ff7a66; --blood: #4e110c; --green: #7cff9e; --display: 'Pirata One', serif; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.25 'VT323', monospace; }
  header { position: sticky; top: 0; display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--bar); border-bottom: 2px solid var(--blood); }
  header h1 { margin: 0; font: 400 24px/1 var(--display); }
  .grow { flex: 1; }
  .count { padding: 2px 8px; border: 1px solid var(--edge); border-radius: 3px; font-size: 14px; color: var(--dim); }
  a { color: var(--copper); }
  main { padding: 0 16px 24px; }
  h2 { margin: 18px 0 6px; font: 400 20px/1 var(--display); color: var(--light); }
  section[hidden] { display: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px; border-bottom: 1px solid var(--edge); overflow-wrap: anywhere; }
  .dim { color: var(--dim); }
  .petition { border: 1px solid var(--red); border-radius: 3px; margin-bottom: 6px; }
  .petition b { color: var(--pink); }
  .asks { margin-top: 4px; color: var(--light); }
  .row.waiting b { color: var(--pink); } .row.busy b, .row.shell b { color: var(--green); }
  .task { margin-top: 2px; color: var(--dim); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vigil { display: flex; align-items: center; gap: 12px; }
  button { font: inherit; color: var(--light); background: var(--btn); border: 1px solid var(--copper); border-radius: 3px; padding: 6px 16px; min-height: 40px; }
  button[hidden] { display: none; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1 data-t="title">Administratum</h1>
  <span class="grow"></span>
  <span class="count" id="count" title="Sessions">0</span>
  <a href="/?hall">Full hall</a>
</header>
<main>
  <section id="petitions" hidden aria-live="polite">
    <h2>Petitions</h2>
    <p class="dim">Answer them on the PC.</p>
    <ul id="petition-list"></ul>
  </section>
  <section>
    <h2>Night Vigil</h2>
    <div class="vigil"><span id="vigil-line">—</span><button id="vigil-btn" type="button" hidden>Arm</button></div>
  </section>
  <section>
    <h2>Sessions</h2>
    <ul id="roster"></ul>
  </section>
  <section>
    <h2>Today</h2>
    <p id="today">—</p>
  </section>
</main>
<script type="module" src="mobile.js"></script>
</body>
</html>
