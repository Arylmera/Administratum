<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administratum</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#120d0a">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<header>
  <h1 data-t="title">Administratum</h1>
  <span class="grow"></span>
  <span class="count" id="count" title="Sessions">0</span>
  <a href="/?hall">Full hall</a>
</header>
<main>
  <section id="petitions" aria-live="polite">
    <h2>Petitions</h2>
    <p class="dim">While the PC allows remote actions, tap a permission prompt to approve or deny it. Always stays on the PC.</p>
    <ul id="petition-list"></ul>
  </section>
  <section>
    <h2>Night Vigil</h2>
    <div class="vigil"><span id="vigil-line">—</span><button id="vigil-btn" type="button" hidden>Arm</button></div>
  </section>
  <section>
    <h2>Sessions</h2>
    <ul id="roster"></ul>
  </section>
  <section>
    <h2>Today</h2>
    <p id="today">—</p>
  </section>
</main>
<script type="module" src="mobile.js"></script>
</body>
</html>
