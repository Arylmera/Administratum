<!doctype html>
<meta charset="utf-8">
<title>Administratum preview</title>
<script>
// The real ui/ in a browser, without the backend: a fake window.__TAURI__ (settings from localStorage, every other
// command refused) and a fixed roster sent every second, for screenshots of the hall.
// Serve the repo root (python -m http.server 8123) and open /tools/preview.html?mode=candles&theme=vault
// (mode: auto|full|candles, theme: a theme id, n: scribes, 1..40, view: flat|39, 39 being 2.5D).
const q = new URLSearchParams(location.search);
for (const [k, key] of [['mode', 'adm.mode'], ['theme', 'adm.theme'], ['scale', 'adm.scale'], ['view', 'adm.view']]) {
  if (q.has(k)) localStorage.setItem(key, q.get(k));
}
localStorage.setItem('adm.pauseHidden', '0'); // a background tab still draws (when the browser runs its frames)
const n = Math.max(1, Math.min(40, +(q.get('n') ?? 9)));
const fake = `
  window.__ROSTER_N = ${n};
  const H = {};
  // A tab in the background gets no animation frames: drive the loop with timers (throttled, but it moves).
  window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16);
  window.__TAURI__ = {
    core: { invoke: name => (name === 'settings_load' ? Promise.resolve({}) : Promise.reject('preview: no backend')) },
    event: { listen: (name, cb) => { (H[name] ??= []).push(cb); return Promise.resolve(() => {}); } },
    window: { getCurrentWindow: () => ({ setAlwaysOnTop: async () => {} }) },
    app: { getVersion: async () => 'preview' },
  };
  const t0 = Date.now() - 60_000, DEPTS = ['Terra', 'Geneseed', 'Hololith', 'Noosphere'], MODELS = ['claude-opus-5-5', 'claude-sonnet-5', 'claude-haiku-4-5-20251001'];
  const STATUS = ['busy', 'busy', 'shell', 'idle', 'waiting', 'busy', 'busy', 'idle', 'busy'];
  const roster = () => Array.from({ length: window.__ROSTER_N }, (_, i) => ({
    id: 's' + i, pid: 0, name: DEPTS[i % 4].toLowerCase() + '-' + (10 + i), dept: DEPTS[i % 4], cwd: 'C:/git/' + DEPTS[i % 4],
    status: STATUS[i % STATUS.length], waitingFor: 'approve Bash', sinceMs: t0 + i * 1000, task: 'Edit · app.js', title: null, asks: null,
    helpers: i % 3 === 0 ? [{ id: 'h' + i, kind: 'Explore', task: 'grep', model: 'haiku', context: { tokens: 20000, model: MODELS[2] } }] : [],
    context: { tokens: 60000 + 90000 * i, model: MODELS[i % 3] }, orca: null, web: null, background: false, compactedAt: null,
    question: null, branch: 'main', limit: null, turn: null,
  }));
  setInterval(() => (H.roster ?? []).forEach(cb => cb({ payload: roster() })), 1000);
`;
// Review notes: the ✎ button (or N) toggles note mode; a click drops a numbered pin with a comment (Enter saves, Esc
// cancels), shift+click on a pin deletes it. Kept in localStorage 'adm.notes' (viewport %, view and theme), which
// Claude reads from its own tab of the same origin.
const notes = `
addEventListener('DOMContentLoaded', () => {
  const KEY = 'adm.notes', load = () => JSON.parse(localStorage.getItem(KEY) || '[]');
  const css = 'position:fixed;z-index:99999;font:12px sans-serif;';
  const layer = document.createElement('div'); layer.style.cssText = css + 'inset:0;pointer-events:none';
  const btn = document.createElement('button'); btn.textContent = '✎ Notes';
  btn.style.cssText = css + 'left:8px;bottom:8px;padding:4px 10px;background:#222;color:#fc6;border:1px solid #fc6;cursor:pointer';
  document.body.append(layer, btn);
  let on = false;
  const toggle = () => { on = !on; layer.style.pointerEvents = on ? 'auto' : 'none'; layer.style.cursor = on ? 'crosshair' : '';
    layer.style.background = on ? 'rgba(255,200,100,.06)' : ''; btn.style.background = on ? '#fc6' : '#222'; btn.style.color = on ? '#222' : '#fc6'; };
  const draw = () => {
    layer.querySelectorAll('.pin').forEach(p => p.remove());
    load().forEach((nt, i) => {
      const p = document.createElement('div'); p.className = 'pin'; p.title = nt.text;
      p.style.cssText = css + 'pointer-events:auto;left:' + nt.x + '%;top:' + nt.y + '%;transform:translate(-11px,-11px);display:flex;gap:4px;align-items:center';
      p.innerHTML = '<b style="width:22px;height:22px;border-radius:50%;background:#e33;color:#fff;display:grid;place-items:center;border:2px solid #fff">' + (i + 1) + '</b>'
        + '<span style="background:rgba(0,0,0,.8);color:#fff;padding:2px 6px;max-width:260px">' + nt.text.replace(/</g, '&lt;') + '</span>';
      p.onclick = e => { e.stopPropagation(); if (e.shiftKey) { const a = load(); a.splice(i, 1); localStorage.setItem(KEY, JSON.stringify(a)); draw(); } };
      layer.append(p);
    });
  };
  layer.addEventListener('click', e => {
    if (e.target !== layer) return;
    const x = e.clientX / innerWidth * 100, y = e.clientY / innerHeight * 100;
    const inp = document.createElement('input'); inp.placeholder = 'comment, Enter';
    inp.style.cssText = css + 'left:' + e.clientX + 'px;top:' + e.clientY + 'px;width:260px;padding:3px';
    document.body.append(inp); inp.focus();
    inp.onkeydown = k => {
      if (k.key === 'Enter' && inp.value.trim()) {
        const a = load(); a.push({ x, y, text: inp.value.trim(), view: localStorage.getItem('adm.view'), theme: localStorage.getItem('adm.theme'), w: innerWidth, h: innerHeight });
        localStorage.setItem(KEY, JSON.stringify(a)); draw();
      }
      if (k.key === 'Enter' || k.key === 'Escape') inp.remove();
      k.stopPropagation();
    };
  });
  btn.onclick = toggle;
  addEventListener('keydown', e => { if (e.key === 'n' && e.target === document.body) toggle(); });
  addEventListener('storage', draw);
  draw();
});
`;
fetch('/ui/index.html').then(r => r.text()).then(html => {
  html = html.replace(/<head>/i, () => `<head><base href="/ui/"><script>${fake}${notes}<\/script>`);
  document.open(); document.write(html); document.close();
});
</script>
