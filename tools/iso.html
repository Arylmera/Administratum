<!--
  Projection trial: one corner of the scriptorium (Ordo Administratum) in today's flat 3/4 view and in the 39 deg view
  (back wall 3:1, side wall 2:1), same scene, same scale, the scribe walking in both. Both are built from the same art:
  face sheets cut out of today's frames (tools/faces.mjs, checked by tools/faces.test.mjs). Not part of the app.
    python -m http.server 8123      then   http://localhost:8123/tools/iso.html
  Built in tools/iso.mjs; the 39 deg scribe, the gothic window and the hangings are in tools/iso_art.mjs.
-->
<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administratum — Projection trial</title>
<style>
  :root { --bg: #121315; --panel: #1b1c1f; --edge: #2c2e33; --ink: #d8d4cc; --dim: #8a8780; --accent: #e0a64a; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--edge); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  header label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
  #legend { margin: 12px 16px 0; color: var(--dim); }
  #legend b { color: var(--ink); }
  main { padding: 16px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  figure { margin: 0; overflow: auto; max-width: 100%; }
  figcaption { color: var(--dim); margin-bottom: 6px; }
  figcaption b { color: var(--ink); }
  canvas { display: block; image-rendering: pixelated; } /* transparent: the page shows around the room */
  .err { color: #ff7a6a; white-space: pre-wrap; }
</style>
<header>
  <h1>Projection trial</h1>
  <label>Zoom <select id="zoom"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
  <label><input type="checkbox" id="night"> night</label>
  <label title="Tint the pixels drawn for one view only: side and top faces, the scribe, the flat-only retouch"><input type="checkbox" id="tint"> tint view-only art</label>
  <label><input type="checkbox" id="pause"> pause</label>
  <label>Step <input type="range" id="step" min="0" max="287" value="0"></label>
</header>
<p id="legend"></p>
<main id="out"></main>
<script type="module">
const $ = id => document.getElementById(id);
try {
  const { build, drawScene, drawFlat, FLAT, PERIOD } = await import('./iso.mjs');
  const { deskSheet, shelfSheet, cogSheet } = await import('./faces.mjs');
  const views = [
    { id: 'flat', title: 'Flat 3/4', note: "today's frames rebuilt from the face sheets; today's scribe" },
    { id: 'a39', title: '39°', note: 'the same face sheets: fronts sheared 3:1, new side and top faces; the 39° scribe' },
  ];
  for (const v of views) {
    v.S = v.id === 'flat' ? null : build();
    const size = v.S ? v.S.size : FLAT;
    const f = document.createElement('figure');
    f.innerHTML = `<figcaption><b>${v.title}</b> — ${v.note}</figcaption><canvas width="${size.w}" height="${size.h}"></canvas>`;
    $('out').append(f);
    v.cv = f.querySelector('canvas'); v.g = v.cv.getContext('2d'); v.g.imageSmoothingEnabled = false;
  }
  // what is shared and what each view needs of its own
  const sheets = [deskSheet(), shelfSheet(), cogSheet()], details = sheets.reduce((n, s) => n + s.details.length, 0);
  const shared = sheets.length + details + 1 /* paper stack */ + 2 /* window, hanging */ + 5 /* floor, wall, wall east, pipe, coolant */;
  const newFaces = 2 * sheets.length + 2; // side and top of each sheet, and of the slate
  $('legend').innerHTML = `<b>Shared by both views:</b> ${shared} pieces of art (${sheets.length} fronts cut from today's frames, ${details} details, the paper stack, the gothic window, the hanging, 5 textures).
    <b>39° only:</b> ${newFaces} new side/top faces (rules) and 12 scribe frames (SW, NE, S39, N39 drawn; SE, NW mirrored).
    <b>Flat only:</b> 12 scribe frames (today's) and 1 retouch (the cogitator's painted shadow).
    Tick <i>tint view-only art</i> to see them in magenta.`;
  $('step').max = PERIOD - 1;
  const pref = (k, d) => { try { return localStorage.getItem(`iso.${k}`) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(`iso.${k}`, v); } catch {} };
  $('zoom').value = pref('zoom', '2'); $('night').checked = pref('night', '') === '1';
  let t = 0;
  const draw = () => { const n = $('night').checked, ti = $('tint').checked; for (const v of views) v.S ? drawScene(v.g, v.S, t, n, ti) : drawFlat(v.g, t, n, ti); };
  const layout = () => {
    const z = +$('zoom').value;
    for (const v of views) { v.cv.style.width = `${v.cv.width * z}px`; v.cv.style.height = `${v.cv.height * z}px`; }
    save('zoom', $('zoom').value); save('night', $('night').checked ? '1' : '');
    draw();
  };
  for (const id of ['zoom', 'night', 'tint']) $(id).onchange = layout;
  $('step').oninput = () => { t = +$('step').value; draw(); };
  layout();
  // setTimeout, not requestAnimationFrame: a background tab gets no frames
  const tick = () => { if (!$('pause').checked) { t = (t + 1) % PERIOD; $('step').value = t; } draw(); setTimeout(tick, 70); };
  tick();
} catch (e) {
  $('out').innerHTML = `<p class="err">${String(e.stack ?? e)}</p>`;
  throw e;
}
</script>
